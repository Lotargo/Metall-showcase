<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Metall — подготовка производства по чертежу. Геометрия детали, заготовка и предварительный маршрут обработки.">
    <meta name="theme-color" content="#f6f5f1">
    <title>Metall — от чертежа к производству</title>
  </head>
  <body id="top">
    <a class="skip-link" href="#main">К содержанию</a>
    <header class="header">
      <div class="nav-shell">
        <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"></span>Metall</a>
        <nav aria-label="Разделы страницы">
          <a href="#model">3D-модель</a>
          <a href="#capabilities">Возможности</a>
        </nav>
        <a class="nav-demo" href="https://lotargo.github.io/Metall-DEMO/">Открыть демо <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-inner wrap">
          <figure class="hero-figure">
            <div class="hero-graphic">
              <canvas id="field" width="720" height="600" aria-hidden="true"></canvas>
              <div class="draft-guides" aria-hidden="true"></div>
              <img class="hero-metal" src="./media/shaft-assembled.webp" width="1120" height="790"
                alt="Ступенчатый вал с подшипниками" fetchpriority="high">
            </div>
          </figure>
          <div class="hero-copy">
            <h1 id="hero-title">От чертежа<br>к производству<span>.</span></h1>
            <a class="button button-dark" href="#model">Рассмотреть в 3D <span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </section>

      <section class="model-story" id="model" aria-labelledby="model-title">
        <div class="model-sticky">
          <div class="model-inner wrap">
            <div class="model-copy">
              <h2 id="model-title">Вал<br>в&nbsp;разборе<span>.</span></h2>
              <div class="model-control">
                <label class="visually-hidden" for="explode">Степень разбора модели</label>
                <input id="explode" type="range" min="0" max="100" value="0" step="1" aria-valuetext="В сборе">
                <div class="range-labels">
                  <button type="button" data-position="0">В сборе</button>
                  <button type="button" data-position="100">В разборе</button>
                </div>
              </div>
            </div>

            <div class="model-figure">
              <div class="model-stage" id="model-stage">
                <div class="stage-grid" aria-hidden="true"></div>
                <img class="model-poster" src="./media/shaft-assembled.webp" width="1120" height="790" alt="">
                <img class="model-poster poster-exploded" src="./media/shaft-exploded.webp" width="1120" height="790" alt="" loading="lazy">
                <div id="model-canvas" aria-hidden="true"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="capabilities wrap" id="capabilities" aria-labelledby="capabilities-title">
        <div class="section-heading">
          <h2 id="capabilities-title">Возможности<br>Metall<span>.</span></h2>
        </div>
        <div class="feature-grid">
          <article class="feature">
            <img src="./media/sketch-drawing.webp" width="840" height="520" alt="" loading="lazy">
            <div class="feature-copy">
              <h3>Разбор чертежа</h3>
            </div>
          </article>
          <article class="feature">
            <img src="./media/sketch-geometry.webp" width="840" height="520" alt="" loading="lazy">
            <div class="feature-copy">
              <h3>Модель и заготовка</h3>
            </div>
          </article>
          <article class="feature">
            <img src="./media/sketch-route.webp" width="840" height="520" alt="" loading="lazy">
            <div class="feature-copy">
              <h3>Маршрут обработки</h3>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap">
        <div class="footer-main">
          <div>
            <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"></span>Metall</a>
          </div>
          <nav aria-label="Навигация в подвале">
            <a href="#model">3D-модель</a>
            <a href="#capabilities">Возможности</a>
          </nav>
          <a class="button button-dark" href="https://lotargo.github.io/Metall-DEMO/">Открыть демо <span aria-hidden="true">↗</span></a>
        </div>
        <div class="footer-bottom"><a href="#top">Наверх <span aria-hidden="true">↑</span></a></div>
      </div>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
